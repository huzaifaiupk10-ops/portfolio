<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #000; display: flex; flex-direction: column; align-items: center; padding: 20px; font-family: Arial; color: white; }
    canvas { border: 1px solid #333; }
    button { margin-top: 16px; padding: 12px 28px; background: #3B82F6; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
    p { color: #94A3B8; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>Portfolio Preview → PNG Converter</h2>
  <canvas id="c" width="1200" height="630"></canvas>
  <button onclick="download()">Download portfolio-preview.png</button>
  <p>Save the downloaded file into your <strong>public/</strong> folder, then delete this file.</p>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, 1200, 630);
    img.src = '/portfolio-preview.svg';

    function download() {
      const a = document.createElement('a');
      a.download = 'portfolio-preview.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    }
  </script>
</body>
</html>
